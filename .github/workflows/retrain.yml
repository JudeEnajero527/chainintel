# Retrains the depeg model on the latest DefiLlama history once a month and commits it,
# so the deployed app picks it up on its next restart.
name: retrain
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          grep -v -E '^(torch|transformers)' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - run: python train_model.py
      - name: Commit the new model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chainintel_model.pkl chainintel_model_meta.json
          git diff --cached --quiet || git commit -m "Monthly model retrain" && git push
